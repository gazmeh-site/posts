<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ویرایشگر مقاله — mirza</title>
<link rel="stylesheet" href="/public/fonts/vazirmatn.css">
<style>
  :root {
    --bg:#ffffff; --panel:#f8fafc; --border:#e2e8f0; --ink:#1e293b; --muted:#64748b;
    --info:#eff6ff; --info-b:#3b82f6;
    --warn:#fffbeb; --warn-b:#f59e0b;
    --danger:#fef2f2; --danger-b:#ef4444;
    --note:#f1f5f9; --note-b:#64748b;
    --draft:#f5f3ff; --draft-b:#8b5cf6;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .topbar {
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:8px 12px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  .topbar .title { font-weight:700; font-size:14px; flex:1; }
  .saved { color:#16a34a; font-size:12px; opacity:0; transition:opacity .3s; }
  .saved.show { opacity:1; }
  button.save {
    background:#2563eb; color:#fff; border:none; border-radius:8px;
    padding:7px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  button.save:hover { background:#1d4ed8; }
  .panes { flex:1 1 auto; display:flex; min-height:0; }
  .pane { flex:1 1 0; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .pane + .pane { border-right:1px solid var(--border); }
  .pane h2 {
    font-size:11px; color:var(--muted); margin:0; padding:6px 12px;
    background:var(--panel); border-bottom:1px solid var(--border);
    font-weight:600; text-transform:uppercase; letter-spacing:.04em;
  }
  textarea {
    flex:1 1 auto; min-height:0; width:100%; border:none; outline:none; resize:none;
    padding:14px 16px; font-family: "Vazirmatn", ui-monospace, Menlo, monospace;
    font-size:14px; line-height:1.95; color:var(--ink); background:var(--bg); direction:rtl;
  }
  .preview { flex:1 1 auto; min-height:0; overflow:auto; padding:14px 18px; line-height:1.95; font-size:14px; }
  .preview h2 { font-size:18px; margin:18px 0 8px; padding:0; background:none; border:none;
    text-transform:none; letter-spacing:0; color:var(--ink); }
  .preview h3 { font-size:16px; margin:14px 0 6px; color:var(--ink); }
  .preview p { margin:8px 0; }
  .preview ul, .preview ol { padding-right:22px; margin:8px 0; }
  .preview code { background:#f1f5f9; padding:1px 5px; border-radius:4px;
    font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .preview pre { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; }
  .preview pre code { background:none; color:inherit; padding:0; }
  .preview blockquote { border-right:3px solid var(--border); margin:8px 0; padding:4px 12px; color:var(--muted); }
  .preview table { border-collapse:collapse; width:100%; margin:10px 0; }
  .preview th, .preview td { border:1px solid var(--border); padding:6px 10px; text-align:right; }
  .preview th { background:var(--panel); }
  .callout { border-right:4px solid var(--note-b); background:var(--note);
    padding:10px 14px; border-radius:8px; margin:10px 0; }
  .callout.info { background:var(--info); border-color:var(--info-b); }
  .callout.warning { background:var(--warn); border-color:var(--warn-b); }
  .callout.danger { background:var(--danger); border-color:var(--danger-b); }
  .callout.note { background:var(--note); border-color:var(--note-b); }
  .callout.draft { background:var(--draft); border-color:var(--draft-b); }
  .err { color:#ef4444; }
  @media (max-width: 720px) { .panes { flex-direction:column; } .pane { flex-basis:50%; } }
</style>
</head>
<body>
<div class="topbar">
  <span class="title">✏️ ویرایشگر مقاله</span>
  <span class="saved" id="saved">✓ ذخیره شد</span>
  <button class="save" id="save">ذخیره و بازگشت</button>
</div>
<div class="panes">
  <div class="pane">
    <h2>متن (Markdown)</h2>
    <textarea id="src" spellcheck="false" placeholder="…"></textarea>
  </div>
  <div class="pane">
    <h2>پیش‌نمایش</h2>
    <div class="preview" id="prev"></div>
  </div>
</div>
<script>
(function () {
  "use strict";
  const src = document.getElementById("src");
  const prev = document.getElementById("prev");
  const saveBtn = document.getElementById("save");
  const saved = document.getElementById("saved");

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  const SPECIAL = /^(#{1,3}\s|>\s?|\*\s|\d+\.\s|```|:::|\s*\|)/;

  function render(md) {
    md = String(md || "").replace(/\r\n/g, "\n");
    const lines = md.split("\n");
    const out = [];
    let i = 0;
    let listType = null;
    function closeList() {
      if (listType) { out.push("</" + (listType === "ul" ? "ul" : "ol") + ">"); listType = null; }
    }
    let m;
    while (i < lines.length) {
      const line = lines[i];

      // fenced code block
      m = line.match(/^```(\w*)\s*$/);
      if (m) {
        closeList();
        const code = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
        i++; // closing fence
        out.push('<pre><code class="lang-' + esc(m[1] || "") + '">' + esc(code.join("\n")) + "</code></pre>");
        continue;
      }

      // container ::: name ... :::
      m = line.match(/^:::\s*(info|warning|danger|note|draft)\s*$/i);
      if (m) {
        closeList();
        const kind = m[1].toLowerCase();
        const body = [];
        i++;
        while (i < lines.length && !/^:::\s*$/.test(lines[i])) { body.push(lines[i]); i++; }
        i++; // closing :::
        out.push('<div class="callout ' + kind + '">' + render(body.join("\n")) + "</div>");
        continue;
      }

      // GFM table: header | separator | rows
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[-:\s|]+\|\s*$/.test(lines[i + 1])) {
        closeList();
        const header = line.trim().replace(/^\||\|$/g, "").split("|").map(s => s.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map(s => s.trim()));
          i++;
        }
        let t = "<table><thead><tr>" + header.map(h => "<th>" + inline(h) + "</th>").join("") + "</tr></thead><tbody>";
        rows.forEach(r => { t += "<tr>" + r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>"; });
        out.push(t + "</tbody></table>");
        continue;
      }

      // heading ## / ### (and fallback # )
      m = line.match(/^(#{2,3})\s+(.*)$/);
      if (m) { closeList(); out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"); i++; continue; }
      m = line.match(/^#\s+(.*)$/);
      if (m) { closeList(); out.push("<h2>" + inline(m[1]) + "</h2>"); i++; continue; }

      // blockquote
      m = line.match(/^>\s?(.*)$/);
      if (m) {
        closeList();
        const bq = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { bq.push(lines[i].replace(/^>\s?/, "")); i++; }
        out.push("<blockquote>" + render(bq.join("\n")) + "</blockquote>");
        continue;
      }

      // unordered list
      m = line.match(/^\*\s+(.*)$/);
      if (m) { if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); i++; continue; }

      // ordered list
      m = line.match(/^\d+\.\s+(.*)$/);
      if (m) { if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; } out.push("<li>" + inline(m[1]) + "</li>"); i++; continue; }

      // blank line
      if (line.trim() === "") { closeList(); i++; continue; }

      // paragraph: gather consecutive plain lines
      const buf = [];
      while (i < lines.length && lines[i].trim() !== "" && !SPECIAL.test(lines[i])) { buf.push(lines[i]); i++; }
      closeList();
      out.push("<p>" + inline(buf.join(" ")) + "</p>");
    }
    closeList();
    return out.join("\n");
  }

  function update() { prev.innerHTML = render(src.value); }
  let t;
  src.addEventListener("input", function () { clearTimeout(t); t = setTimeout(update, 200); });

  saveBtn.addEventListener("click", function () {
    window.parent.postMessage({ source: "mirza-draft-editor", content: src.value }, "*");
    saved.classList.add("show");
    setTimeout(function () { saved.classList.remove("show"); }, 1500);
  });

  function load() {
    const id = new URLSearchParams(location.search).get("d") || "";
    if (!id) { update(); return; }
    fetch("/public/mirza-draft-" + encodeURIComponent(id) + ".json")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (j) { src.value = j.content || ""; update(); })
      .catch(function (e) { prev.innerHTML = '<p class="err">خطا در بارگذاری متن (' + e + "). فایل JSON را در public/ بررسی کن.</p>"; });
  }
  load();
})();
</script>
</body>
</html>
